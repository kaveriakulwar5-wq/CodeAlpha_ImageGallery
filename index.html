<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeAlpha - Image Gallery</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial, sans-serif}
body{background:#0f172a;color:white;padding:20px}
h1{text-align:center;margin:15px 0}
.filters{text-align:center;margin:20px 0}
.filters button{padding:8px 18px;margin:5px;border:none;border-radius:20px;background:#1e293b;color:white;cursor:pointer;transition:0.3s}
.filters button.active,.filters button:hover{background:#3b82f6}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px;max-width:1100px;margin:auto}
.gallery img{width:100%;height:220px;object-fit:cover;border-radius:10px;cursor:pointer;transition:0.3s}
.gallery img:hover{transform:scale(1.05);filter:brightness(1.2)}
/* Lightbox */
.lightbox{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);justify-content:center;align-items:center;z-index:100}
.lightbox.active{display:flex}
.lightbox img{max-width:90%;max-height:80%;border-radius:10px}
.close{position:absolute;top:20px;right:30px;font-size:40px;cursor:pointer;color:white}
.prev,.next{position:absolute;top:50%;font-size:40px;padding:10px;cursor:pointer;color:white;user-select:none;background:rgba(255,255,255,0.1);border-radius:50%}
.prev{left:20px}.next{right:20px}
</style>
</head>
<body>

<h1>Image Gallery - CodeAlpha Task 1</h1>

<div class="filters">
  <button class="active" onclick="filterImg('all',this)">All</button>
  <button onclick="filterImg('nature',this)">Nature</button>
  <button onclick="filterImg('city',this)">City</button>
</div>

<div class="gallery" id="gallery">
  <img src="https://picsum.photos/id/15/400/300" data-cat="nature" onclick="openLightbox(this.src)">
  <img src="https://picsum.photos/id/28/400/300" data-cat="nature" onclick="openLightbox(this.src)">
  <img src="https://picsum.photos/id/29/400/300" data-cat="city" onclick="openLightbox(this.src)">
  <img src="https://picsum.photos/id/1015/400/300" data-cat="nature" onclick="openLightbox(this.src)">
  <img src="https://picsum.photos/id/1019/400/300" data-cat="nature" onclick="openLightbox(this.src)">
  <img src="https://picsum.photos/id/1031/400/300" data-cat="city" onclick="openLightbox(this.src)">
  <img src="https://picsum.photos/id/1040/400/300" data-cat="city" onclick="openLightbox(this.src)">
  <img src="https://picsum.photos/id/1043/400/300" data-cat="nature" onclick="openLightbox(this.src)">
</div>

<div class="lightbox" id="lightbox">
  <span class="close" onclick="closeLightbox()">&times;</span>
  <span class="prev" onclick="changeImg(-1)">&#10094;</span>
  <img id="lightbox-img" src="">
  <span class="next" onclick="changeImg(1)">&#10095;</span>
</div>

<script>
let images = Array.from(document.querySelectorAll('.gallery img'));
let current = 0;

function openLightbox(src){
  document.getElementById('lightbox').classList.add('active');
  document.getElementById('lightbox-img').src = src;
  current = images.findIndex(i => i.src === src);
}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('active');
}
function changeImg(dir){
  current = (current + dir + images.length) % images.length;
  document.getElementById('lightbox-img').src = images[current].src;
}
function filterImg(cat,btn){
  document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  images.forEach(img=>{
    img.style.display = (cat==='all' || img.dataset.cat===cat)? 'block' : 'none';
  });
}
// keyboard navigation
document.addEventListener('keydown', e=>{
  if(e.key==='Escape') closeLightbox();
  if(e.key==='ArrowRight') changeImg(1);
  if(e.key==='ArrowLeft') changeImg(-1);
});
</script>
</body>
</html>
